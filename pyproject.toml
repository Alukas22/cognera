[tool.poetry]
name = "cognera"
version = "0.1.0"
description = "Cognera platform foundation"
authors = ["Cognera Team <team@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.118.0"
uvicorn = "^0.23.0"
sqlalchemy = "^2.0.0"
